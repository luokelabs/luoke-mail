[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "luoke-mail"
version = "0.18.19"
description = "螺壳邮件助手：用本机模型整理收件箱（只读、不出本机）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []          # standard library only; plus luoke-mem (installed, or checked out next to luoke-mail)

[project.scripts]
luoke-mail = "luoke_mail.__main__:main"

[tool.setuptools]
packages = ["luoke_mail"]

[tool.setuptools.package-data]
luoke_mail = ["static/*", "static/img/*"]
